<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Jellyfish Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #000514; /* Fallback color */
        }

        canvas {
            display: block; /* Removes tiny scrollbar on some browsers */
        }
    </style>
</head>
<body>

<canvas id="oceanCanvas"></canvas>

<script>
    const canvas = document.getElementById('oceanCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let jellyfishes = [];
    let bubbles = [];

    // Configuration
    const JELLYFISH_COUNT = 15;
    const BUBBLE_COUNT = 40;

    // Resize handling
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Utility: Random range
    const random = (min, max) => Math.random() * (max - min) + min;

    // --- CLASSES ---

    class Jellyfish {
        constructor() {
            this.reset();
        }

        reset() {
            // Start at random X, above the screen
            this.x = Math.random() * width;
            this.y = -100; 
            
            // Randomize properties
            this.size = random(20, 50);
            this.speedY = random(1, 3);
            this.swaySpeed = random(0.02, 0.05);
            this.swayAmp = random(10, 40);
            
            // Color: Hue for rainbow effect
            this.hue = random(160, 280); // Blues and purples
            this.tentacleCount = random(5, 12);
            this.opacity = random(0.6, 0.9);
        }

        update(time) {
            // Move down
            this.y += this.speedY;

            // Sway side to side using Sine wave
            // We add time to the sine function to animate it
            this.x += Math.sin(time * this.swaySpeed + this.x) * this.swayAmp;

            // Reset if it goes past the bottom
            if (this.y > height + 100) {
                this.reset();
            }
        }

        draw(ctx, time) {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Create the glowing effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 1)`;
            
            // Draw Body (Bell)
            ctx.beginPath();
            // We draw an ellipse for the bell shape
            ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.opacity})`;
            ctx.fill();

            // Draw Tentacles
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${this.hue}, 100%, 60%, ${this.opacity})`;
            ctx.lineWidth = this.size / 10;
            
            // Add some flow to tentacles based on time
            const flow = Math.sin(time * 0.1) * 2;

            for (let i = 0; i < this.tentacleCount; i++) {
                const angle = (Math.PI * 2 / this.tentacleCount) * i;
                // Draw tentacles downwards and slightly outward
                for (let j = 0; j < 15; j++) {
                    const tx = Math.cos(angle) * (this.size + j * 2);
                    const ty = Math.sin(angle) * (this.size + j * 2);
                    
                    // Wiggle the tentacles slightly
                    const wiggle = Math.sin(time * 0.5 + j) * 2;

                    if (j === 0) {
                        ctx.moveTo(0, this.size * 0.6); // Start from bottom of bell
                    } else {
                        ctx.lineTo(tx, ty);
                    }
                }
            }
            ctx.stroke();

            // Draw a glowing center light inside the jellyfish
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.5})`;
            ctx.arc(0, 0, this.size * 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    class Bubble {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + random(0, 100);
            this.radius = random(1, 4);
            this.speedY = random(2, 6);
        }

        update() {
            this.y -= this.speedY;
            // Gentle horizontal drift
            this.x += Math.sin(this.y * 0.01) * 0.5;

            if (this.y < -20) {
                this.reset();
            }
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
        }
    }

    // --- INITIALIZATION ---

    function init() {
        for (let i = 0; i < JELLYFISH_COUNT; i++) {
            jellyfishes.push(new Jellyfish());
        }
        for (let i = 0; i < BUBBLE_COUNT; i++) {
            bubbles.push(new Bubble());
        }
    }

    // --- ANIMATION LOOP ---

    let time = 0;

    function animate() {
        // Clear canvas with a fade effect for trails (optional, but we'll do clean clear for crispness)
        // To create a "water surface" reflection, we can draw a gradient at the top
        
        // 1. Create Deep Sea Background Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#020024'); // Deep dark purple/black
        gradient.addColorStop(0.5, '#090979'); // Blue
        gradient.addColorStop(1, '#00d4ff'); // Light blue surface
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Draw a "surface" line at the top for realism
        ctx.beginPath();
        ctx.moveTo(0, height * 0.1);
        ctx.lineTo(width, height * 0.1);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.stroke();


        time += 1;

        // Update and Draw Jellyfish
        jellyfishes.forEach(jelly => {
            jelly.update(time);
            jelly.draw(ctx, time);
        });

        // Update and Draw Bubbles
        bubbles.forEach(bubble => {
            bubble.update();
            bubble.draw(ctx);
        });

        requestAnimationFrame(animate);
    }

    init();
    animate();

</script>

</body>
</html>
