<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bioluminescent Deep Sea Scene</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #020514;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="deepSeaCanvas"></canvas>

  <script>
    const canvas = document.getElementById('deepSeaCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Palette of vibrant neon hues for jellyfish
    const HUES = [185, 275, 320, 140, 45];

    class Jellyfish {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 100;
        this.size = 20 + Math.random() * 25;
        this.baseHue = HUES[Math.floor(Math.random() * HUES.length)];
        this.speed = 0.4 + Math.random() * 0.5;
        this.driftX = (Math.random() - 0.5) * 0.3;
        this.pulseSpeed = 0.025 + Math.random() * 0.02;
        this.pulseOffset = Math.random() * Math.PI * 2;
        this.tentacleCount = 5 + Math.floor(Math.random() * 4);
        this.tentacleLength = this.size * (3 + Math.random() * 2);
      }

      update(time) {
        // Rhythmic propulsion pulse
        const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset);
        const swimBoost = Math.max(0, pulse) * 1.2;

        this.y -= this.speed + swimBoost;
        this.x += this.driftX + Math.cos(time * 0.01 + this.pulseOffset) * 0.3;

        // Reset when floating off top
        if (this.y < -this.tentacleLength - 60) {
          this.reset(false);
        }
      }

      draw(time) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset);
        const squeeze = 1 + pulse * 0.18; 
        const stretch = 1 - pulse * 0.12; 
        const r = this.size;

        const mainColor = `hsl(${this.baseHue}, 100%, 65%)`;
        const innerColor = `hsl(${this.baseHue + 25}, 100%, 80%)`;

        // Bioluminescent radial glow
        const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.5);
        glow.addColorStop(0, `hsla(${this.baseHue}, 100%, 60%, 0.4)`);
        glow.addColorStop(0.5, `hsla(${this.baseHue}, 100%, 50%, 0.1)`);
        glow.addColorStop(1, 'transparent');

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Tentacles
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        for (let i = 0; i < this.tentacleCount; i++) {
          const spacing = (i / (this.tentacleCount - 1) - 0.5) * (r * 1.4 * squeeze);
          ctx.beginPath();
          ctx.moveTo(spacing, 0);

          const segments = 12;
          const segLength = this.tentacleLength / segments;

          for (let s = 1; s <= segments; s++) {
            const wave = Math.sin(time * 0.04 + s * 0.4 + i + this.pulseOffset) * (s * 1.8);
            ctx.lineTo(spacing + wave, s * segLength);
          }

          ctx.strokeStyle = `hsla(${this.baseHue}, 90%, 75%, ${0.5 - (i % 2) * 0.15})`;
          ctx.shadowColor = mainColor;
          ctx.shadowBlur = 8;
          ctx.stroke();
        }

        // Translucent Bell/Cap
        ctx.beginPath();
        ctx.moveTo(-r * squeeze, 0);
        ctx.bezierCurveTo(
          -r * squeeze, -r * 1.4 * stretch,
          r * squeeze, -r * 1.4 * stretch,
          r * squeeze, 0
        );
        ctx.quadraticCurveTo(0, r * 0.2 * stretch, -r * squeeze, 0);
        ctx.closePath();

        const bellGrad = ctx.createLinearGradient(0, -r * 1.4, 0, 0);
        bellGrad.addColorStop(0, `hsla(${this.baseHue}, 100%, 75%, 0.85)`);
        bellGrad.addColorStop(0.6, `hsla(${this.baseHue + 20}, 90%, 55%, 0.4)`);
        bellGrad.addColorStop(1, `hsla(${this.baseHue}, 100%, 80%, 0.7)`);

        ctx.fillStyle = bellGrad;
        ctx.shadowColor = mainColor;
        ctx.shadowBlur = 18;
        ctx.fill();

        // Inner glowing core
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.4 * stretch, r * 0.35 * squeeze, r * 0.45 * stretch, 0, 0, Math.PI * 2);
        ctx.fillStyle = innerColor;
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.restore();
      }
    }

    // Floating Marine Snow / Micro-plankton
    const spores = Array.from({ length: 90 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 0.8 + Math.random() * 2,
      alpha: 0.2 + Math.random() * 0.6,
      speedY: -0.15 - Math.random() * 0.3,
      speedX: (Math.random() - 0.5) * 0.2,
      hue: Math.random() > 0.5 ? 180 : 300
    }));

    const jellies = Array.from({ length: 11 }, () => new Jellyfish());

    let frame = 0;
    function animate() {
      frame++;

      // Deep abyss gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#010511');
      bgGrad.addColorStop(0.5, '#030c24');
      bgGrad.addColorStop(1, '#000208');

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Bioluminescent blending
      ctx.globalCompositeOperation = 'screen';

      // Draw drifting spores
      for (const p of spores) {
        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y < 0) p.y = height;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha})`;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 65%)`;
        ctx.shadowBlur = 6;
        ctx.fill();
      }

      // Update and draw jellyfish
      for (const jelly of jellies) {
        jelly.update(frame);
        jelly.draw(frame);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
