<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Jellyfish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bubbles.length = 0;
            initBubbles();
        });

        // Color palettes for jellyfish
        const palettes = [
            { body: '#ff00ff', glow: '#ff00ff', tentacle: '#ff66ff' },   // Magenta
            { body: '#00ffff', glow: '#00ffff', tentacle: '#66ffff' },   // Cyan
            { body: '#ff6600', glow: '#ff6600', tentacle: '#ff9944' },   // Orange
            { body: '#cc00ff', glow: '#cc00ff', tentacle: '#dd66ff' },   // Purple
            { body: '#00ff88', glow: '#00ff88', tentacle: '#66ffbb' },   // Green
            { body: '#ff3366', glow: '#ff3366', tentacle: '#ff7799' },   // Pink
        ];

        // Jellyfish class
        class Jellyfish {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + 100;
                this.baseSize = Math.random() * 40 + 30;
                this.speedY = -(Math.random() * 0.5 + 0.3);
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.pulseSpeed = Math.random() * 0.03 + 0.02;
                this.tentacleCount = Math.floor(Math.random() * 4) + 5;
                this.tentacleLength = Math.random() * 80 + 60;
                this.palette = palettes[Math.floor(Math.random() * palettes.length)];
                this.opacity = Math.random() * 0.3 + 0.7;
                this.innerGlowSize = Math.random() * 5 + 2;
            }

            update(time) {
                this.y += this.speedY;
                this.x += Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.5 + this.speedX;

                this.pulsePhase += this.pulseSpeed;

                // Reset if off screen
                if (this.y < -200 || this.x < -200 || this.x > canvas.width + 200) {
                    this.reset();
                }
            }

            draw(ctx, time) {
                const pulse = Math.sin(this.pulsePhase) * 0.15 + 1;
                const wobble = Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;
                const size = this.baseSize * pulse;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Outer glow
                ctx.shadowBlur = 40;
                ctx.shadowColor = this.palette.glow;

                // Draw dome/bell
                ctx.beginPath();
                ctx.moveTo(-size, 0);
                ctx.bezierCurveTo(
                    -size * 0.8, -size * 0.9,
                    size * 0.8, -size * 0.9,
                    size, 0
                );
                ctx.closePath();

                // Gradient for dome
                const domeGradient = ctx.createRadialGradient(0, -size * 0.3, 0, 0, -size * 0.3, size);
                domeGradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity * 0.6})`);
                domeGradient.addColorStop(0.3, this.palette.body + Math.floor(this.opacity * 200).toString(16).padStart(2, '0'));
                domeGradient.addColorStop(0.7, this.palette.body + '44');
                domeGradient.addColorStop(1, this.palette.body + '11');

                ctx.fillStyle = domeGradient;
                ctx.fill();

                // Inner glow spot
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(0, -size * 0.25, size * 0.3, size * 0.2, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
                ctx.fill();

                // Draw tentacles
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.palette.tentacle;

                for (let i = 0; i < this.tentacleCount; i++) {
                    const x = (i / (this.tentacleCount - 1) - 0.5) * size * 1.5;
                    const tentacleWidth = Math.random() * 2 + 1;

                    ctx.beginPath();
                    ctx.moveTo(x, 0);

                    const segments = 6;
                    for (let j = 1; j <= segments; j++) {
                        const t = j / segments;
                        const ty = t * this.tentacleLength;
                        const wave = Math.sin(time * 0.003 + i + t * 2) * (10 + t * 15);
                        const tx = x + wave + wobble * t * 10;
                        ctx.lineTo(tx, ty);
                    }

                    ctx.strokeStyle = this.palette.tentacle + Math.floor(this.opacity * 180).toString(16).padStart(2, '0');
                    ctx.lineWidth = tentacleWidth;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // Bubble class
        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 4 + 1;
                this.speedY = -(Math.random() * 1.5 + 0.3);
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.opacity = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.wobble) * 0.3;
                this.wobble += this.wobbleSpeed;

                if (this.y < -10) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 230, 255, ${this.opacity})`;
                ctx.fill();

                // Highlight
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
                ctx.fill();
            }
        }

        // Particle class for deep sea snow
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = Math.random() * 0.3 + 0.1;
                this.opacity = Math.random() * 0.3 + 0.05;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y > canvas.height + 10) {
                    this.y = -10;
                }
                if (this.x < -10) this.x = canvas.width + 10;
                if (this.x > canvas.width + 10) this.x = -10;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(150, 200, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Initialize objects
        const jellyfish = [];
        const bubbles = [];
        const particles = [];

        // Create jellyfish
        for (let i = 0; i < 12; i++) {
            jellyfish.push(new Jellyfish());
        }

        // Create bubbles
        function initBubbles() {
            for (let i = 0; i < 40; i++) {
                bubbles.push(new Bubble());
            }
        }
        initBubbles();

        // Create particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // Draw background
        function drawBackground() {
            // Deep sea gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#001133');
            gradient.addColorStop(0.3, '#001845');
            gradient.addColorStop(0.7, '#001a3c');
            gradient.addColorStop(1, '#000b1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Light rays from above
        function drawLightRays(time) {
            ctx.save();
            ctx.globalAlpha = 0.03;
            for (let i = 0; i < 5; i++) {
                const x = canvas.width * 0.2 + (i * canvas.width * 0.15);
                const sway = Math.sin(time * 0.001 + i) * 50;

                ctx.beginPath();
                ctx.moveTo(x + sway - 30, 0);
                ctx.lineTo(x + sway + 30, 0);
                ctx.lineTo(x + sway + 100, canvas.height);
                ctx.lineTo(x + sway - 100, canvas.height);
                ctx.closePath();

                const rayGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                rayGradient.addColorStop(0, 'rgba(100, 200, 255, 0.3)');
                rayGradient.addColorStop(1, 'rgba(0, 0, 50, 0)');
                ctx.fillStyle = rayGradient;
                ctx.fill();
            }
            ctx.restore();
        }

        // Animation loop
        let time = 0;

        function animate() {
            time++;
            drawBackground();
            drawLightRays(time);

            // Draw particles
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // Draw and update jellyfish
            jellyfish.forEach(jelly => {
                jelly.update(time);
                jelly.draw(ctx, time);
            });

            // Draw bubbles
            bubbles.forEach(bubble => {
                bubble.update();
                bubble.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
