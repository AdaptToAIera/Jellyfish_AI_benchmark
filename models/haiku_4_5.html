<html>
<canvas id="canvas" width="800" height="600"></canvas>
<style>
body { margin: 0; padding: 0; background: #000814; }
canvas { display: block; width: 100%; height: auto; max-width: 800px; margin: 0 auto; background: linear-gradient(to bottom, #001b3d, #000814); }
</style>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let time = 0;

const jellyfish = [];
const particles = [];

class Jellyfish {
  constructor(x, y, size, color, glowColor) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.baseY = y;
    this.color = color;
    this.glowColor = glowColor;
    this.tentacles = Array(8).fill(0).map(() => ({ x: 0, y: 0, length: 40 + Math.random() * 30 }));
    this.wobble = Math.random() * Math.PI * 2;
    this.speed = 0.5 + Math.random() * 0.5;
    this.glowIntensity = 0.3 + Math.random() * 0.4;
  }

  update() {
    this.wobble += 0.02 * this.speed;
    this.y = this.baseY + Math.sin(this.wobble + time * 0.02) * 20;
    
    this.tentacles.forEach((t, i) => {
      const angle = (i / this.tentacles.length) * Math.PI * 2;
      const wave = Math.sin(time * 0.03 + i) * 15;
      t.x = Math.cos(angle) * 30 + wave;
      t.y = Math.sin(angle) * 30 + Math.sin(time * 0.02 + i * 0.5) * 20;
    });
  }

  draw() {
    const gradient = ctx.createRadialGradient(this.x, this.y - 15, 0, this.x, this.y - 15, this.size);
    gradient.addColorStop(0, this.glowColor + Math.floor(this.glowIntensity * 255).toString(16).padStart(2, '0'));
    gradient.addColorStop(0.7, this.color + 'cc');
    gradient.addColorStop(1, this.color + '00');

    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 30 * this.glowIntensity;
    
    // Bell
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y - 15, this.size, this.size * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tentacles
    ctx.strokeStyle = this.color + 'aa';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20 * this.glowIntensity;
    
    this.tentacles.forEach((t, i) => {
      const x1 = this.x + t.x * 0.5;
      const y1 = this.y + t.y * 0.3;
      const x2 = this.x + t.x;
      const y2 = this.y + t.y + t.length;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(x1 + Math.sin(time * 0.02 + i) * 10, y1 + 30, x2, y2);
      ctx.stroke();
    });

    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = Math.random() * 1 + 0.5;
    this.life = 1;
    this.color = ['#00d4ff', '#00ff88', '#ff00ff', '#ffff00'][Math.floor(Math.random() * 4)];
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw() {
    ctx.globalAlpha = this.life * 0.6;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

function init() {
  const colors = [
    { c: '#ff1493', g: '#ff69b4' },
    { c: '#00d4ff', g: '#00ffff' },
    { c: '#00ff88', g: '#00ffaa' },
    { c: '#ff00ff', g: '#ff69ff' },
    { c: '#ffaa00', g: '#ffdd00' },
    { c: '#00aaff', g: '#00ddff' },
  ];

  for (let i = 0; i < 6; i++) {
    const color = colors[i % colors.length];
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height * 0.6) + 50;
    const size = 30 + Math.random() * 40;
    jellyfish.push(new Jellyfish(x, y, size, color.c, color.g));
  }
}

function animate() {
  ctx.fillStyle = 'rgba(0, 8, 20, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  time++;

  // Update and draw jellyfish
  jellyfish.forEach(j => {
    j.update();
    j.draw();

    // Spawn particles occasionally
    if (Math.random() < 0.05) {
      particles.push(new Particle(j.x + (Math.random() - 0.5) * j.size, j.y + j.size));
    }
  });

  // Update and draw particles
  particles.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  });

  // Add floating particles
  if (Math.random() < 0.1) {
    const x = Math.random() * canvas.width;
    const y = canvas.height;
    const p = new Particle(x, y);
    p.vy = -Math.random() * 2 - 1;
    particles.push(p);
  }

  requestAnimationFrame(animate);
}

init();
animate();
</script>
</html>
