<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Sea Jellyfish</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000814;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------- Utility ----------
function rand(min, max) { return Math.random() * (max - min) + min; }

// ---------- Background bubbles / particles ----------
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.r = rand(0.5, 2.2);
    this.speed = rand(0.1, 0.5);
    this.alpha = rand(0.1, 0.6);
    this.drift = rand(-0.3, 0.3);
  }
  update() {
    this.y -= this.speed;
    this.x += this.drift;
    if (this.y < -10) this.reset(), (this.y = H + 10);
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 220, 255, ${this.alpha})`;
    ctx.fill();
  }
}

const particles = [];
for (let i = 0; i < 120; i++) particles.push(new Particle());

// ---------- Rising bubbles (bigger, with subtle wobble) ----------
class Bubble {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W);
    this.y = H + rand(0, H);
    this.r = rand(2, 7);
    this.speed = rand(0.4, 1.2);
    this.wobble = rand(0, Math.PI * 2);
    this.wobbleSpeed = rand(0.01, 0.03);
  }
  update() {
    this.y -= this.speed;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.5;
    if (this.y < -20) this.reset(), (this.y = H + 20);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,240,255,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
  }
}
const bubbles = [];
for (let i = 0; i < 25; i++) bubbles.push(new Bubble());

// ---------- Jellyfish ----------
class Jellyfish {
  constructor() {
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.baseSize = rand(25, 65);
    this.speedY = rand(0.15, 0.45);
    this.driftX = rand(-0.3, 0.3);
    this.pulsePhase = rand(0, Math.PI * 2);
    this.pulseSpeed = rand(0.02, 0.045);
    this.tentacleCount = Math.floor(rand(6, 10));
    this.hue = rand(0, 360);
    this.tentaclePhase = rand(0, Math.PI * 2);
    this.opacityBase = rand(0.55, 0.9);
    this.direction = Math.random() < 0.5 ? -1 : 1;
    this.wobble = rand(0, Math.PI * 2);
    this.wobbleSpeed = rand(0.005, 0.015);
  }

  update() {
    this.pulsePhase += this.pulseSpeed;
    this.tentaclePhase += this.pulseSpeed * 1.5;
    this.wobble += this.wobbleSpeed;
    this.y -= this.speedY;
    this.x += this.driftX + Math.sin(this.wobble) * 0.4;

    if (this.y < -this.baseSize * 3) {
      this.y = H + this.baseSize * 3;
      this.x = rand(0, W);
    }
    if (this.x < -this.baseSize * 2) this.x = W + this.baseSize * 2;
    if (this.x > W + this.baseSize * 2) this.x = -this.baseSize * 2;
  }

  draw() {
    const pulse = Math.sin(this.pulsePhase) * 0.15 + 1; // scale 0.85 - 1.15
    const size = this.baseSize * pulse;
    const color = `hsla(${this.hue}, 100%, 65%, ${this.opacityBase})`;
    const glowColor = `hsla(${this.hue}, 100%, 60%, 0.9)`;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Outer glow
    const glow = ctx.createRadialGradient(0, 0, size * 0.1, 0, 0, size * 2.2);
    glow.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0.35)`);
    glow.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, size * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Bell (dome) shape
    ctx.beginPath();
    ctx.moveTo(-size, 0);
    ctx.bezierCurveTo(-size, -size * 1.3, size, -size * 1.3, size, 0);
    // scalloped bottom edge
    const scallops = 6;
    for (let i = 0; i <= scallops; i++) {
      const sx = size - (2 * size * i) / scallops;
      const sy = Math.sin(this.pulsePhase + i) * size * 0.08;
      ctx.quadraticCurveTo(
        sx + (size / scallops), sy + size * 0.12,
        sx, sy
      );
    }
    ctx.closePath();

    const bellGradient = ctx.createLinearGradient(0, -size * 1.3, 0, size * 0.15);
    bellGradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.opacityBase})`);
    bellGradient.addColorStop(1, `hsla(${this.hue}, 100%, 55%, ${this.opacityBase * 0.5})`);
    ctx.fillStyle = bellGradient;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = size * 0.9;
    ctx.fill();

    // Inner bell lines (rib pattern)
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 90%, 0.35)`;
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * size * 0.3, -size * 1.1);
      ctx.quadraticCurveTo(i * size * 0.35, -size * 0.4, i * size * 0.15, size * 0.05);
      ctx.stroke();
    }

    // Short inner oral arms
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 85%, 0.5)`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const ox = (i - 1.5) * size * 0.15;
      ctx.beginPath();
      ctx.moveTo(ox, size * 0.05);
      const wig = Math.sin(this.tentaclePhase + i) * size * 0.15;
      ctx.quadraticCurveTo(ox + wig, size * 0.5, ox + wig * 0.5, size * 0.9);
      ctx.stroke();
    }

    // Long trailing tentacles
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, 0.4)`;
    ctx.lineWidth = 1;
    for (let i = 0; i < this.tentacleCount; i++) {
      const t = i / (this.tentacleCount - 1);
      const startX = (t - 0.5) * size * 1.8;
      ctx.beginPath();
      ctx.moveTo(startX, size * 0.05);
      let prevX = startX;
      let prevY = size * 0.05;
      const segments = 6;
      const length = size * (1.8 + Math.sin(i) * 0.3);
      for (let s = 1; s <= segments; s++) {
        const segT = s / segments;
        const wig = Math.sin(this.tentaclePhase + i * 0.7 + s * 0.9) * size * 0.12 * segT;
        const nx = startX + wig;
        const ny = size * 0.05 + length * segT;
        ctx.quadraticCurveTo(prevX, prevY, nx, ny);
        prevX = nx;
        prevY = ny;
      }
      ctx.stroke();
    }

    ctx.restore();
  }
}

const jellyfishArr = [];
const JELLY_COUNT = 9;
for (let i = 0; i < JELLY_COUNT; i++) jellyfishArr.push(new Jellyfish());

// ---------- Light rays (subtle) ----------
function drawRays(time) {
  ctx.save();
  const rayCount = 5;
  for (let i = 0; i < rayCount; i++) {
    const x = (W / rayCount) * i + Math.sin(time * 0.0003 + i) * 60;
    const grad = ctx.createLinearGradient(x, 0, x + 120, H);
    grad.addColorStop(0, 'rgba(120,200,255,0.06)');
    grad.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - 40, 0);
    ctx.lineTo(x + 140, 0);
    ctx.lineTo(x + 260, H);
    ctx.lineTo(x - 120, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ---------- Background gradient ----------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#001a33');
  grad.addColorStop(0.5, '#000d1f');
  grad.addColorStop(1, '#000208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Animation Loop ----------
let time = 0;
function animate() {
  time += 16;
  drawBackground();
  drawRays(time);

  particles.forEach(p => { p.update(); p.draw(); });
  bubbles.forEach(b => { b.update(); b.draw(); });

  // sort jellyfish by size for a subtle depth effect (bigger ones drawn on top)
  jellyfishArr.sort((a, b) => a.baseSize - b.baseSize);
  jellyfishArr.forEach(j => { j.update(); j.draw(); });

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
