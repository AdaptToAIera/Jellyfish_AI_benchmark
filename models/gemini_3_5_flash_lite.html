<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Deep Sea Jellyfish Scene</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #020514;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="deepSeaCanvas"></canvas>

<script>
    const canvas = document.getElementById('deepSeaCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas to fill window
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Background floating particles (plankton/bubbles)
    const particles = [];
    const particleCount = 70;

    for (let i = 0; i < particleCount; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 0.5,
            color: `rgba(${Math.floor(Math.random() * 100 + 100)}, ${Math.floor(Math.random() * 200 + 55)}, 255, ${Math.random() * 0.5 + 0.2})`,
            speedY: -(Math.random() * 0.4 + 0.1),
            speedX: (Math.random() - 0.5) * 0.3
        });
    }

    // Jellyfish Class
    class Jellyfish {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + 150 + Math.random() * 200;
            this.radius = Math.random() * 25 + 20; // Size of the cap
            this.speedY = Math.random() * 0.6 + 0.4;
            this.wobbleSpeed = Math.random() * 0.03 + 0.01;
            this.wobbleDist = Math.random() * 20 + 10;
            this.angle = Math.random() * Math.PI * 2;
            
            // Color schemes (Cyan, Magenta, Gold, Purple)
            const schemes = [
                { main: 'rgba(0, 242, 254, ', sub: 'rgba(79, 172, 254, ' },
                { main: 'rgba(255, 0, 128, ', sub: 'rgba(255, 117, 140, ' },
                { main: 'rgba(189, 0, 255, ', sub: 'rgba(109, 40, 217, ' },
                { main: 'rgba(255, 204, 0, ', sub: 'rgba(255, 126, 95, ' }
            ];
            this.scheme = schemes[Math.floor(Math.random() * schemes.length)];
            
            // Tentacles config
            this.tentacleCount = Math.floor(Math.random() * 4) + 5;
            this.tentacles = [];
            for (let i = 0; i < this.tentacleCount; i++) {
                this.tentacles.push({
                    length: Math.random() * 80 + 70,
                    frequency: Math.random() * 0.05 + 0.02,
                    offset: i * 0.5
                });
            }
        }

        update() {
            this.y -= this.speedY;
            this.angle += this.wobbleSpeed;
            this.currentX = this.x + Math.sin(this.angle) * this.wobbleDist;

            // Reset if it goes off the top screen
            if (this.y < -200) {
                this.reset();
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.currentX, this.y);

            // Pulsing effect for the cap
            const pulse = Math.sin(this.angle * 2) * 3;
            const currentRadiusY = this.radius + pulse;

            // Draw Tentacles (behind the cap)
            this.tentacles.forEach((t, index) => {
                ctx.beginPath();
                // Space tentacles evenly across the bottom base of the cap
                const startX = (index - (this.tentacleCount - 1) / 2) * (this.radius / (this.tentacleCount * 0.5));
                ctx.moveTo(startX, currentRadiusY * 0.5);

                // Draw wavy path using bezier curves
                let prevX = startX;
                let prevY = currentRadiusY * 0.5;
                const segments = 10;
                const segLength = t.length / segments;

                for (let s = 1; s <= segments; s++) {
                    const wave = Math.sin(this.angle * 2 + s * 0.4 + t.offset) * 10;
                    const nextX = startX + wave;
                    const nextY = (currentRadiusY * 0.5) + (s * segLength);
                    
                    ctx.quadraticCurveTo(prevX, prevY + segLength * 0.5, nextX, nextY);
                    prevX = nextX;
                    prevY = nextY;
                }

                ctx.strokeStyle = this.scheme.sub + '0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Draw Jellyfish Cap (Bell)
            ctx.beginPath();
            // Semi-circle/dome top arc
            ctx.arc(0, 0, this.radius, Math.PI, 0, false);
            
            // Scalloped bottom edge of the bell
            const points = 6;
            const step = (this.radius * 2) / points;
            for (let i = 0; i <= points; i++) {
                const px = this.radius - (i * step);
                const py = currentRadiusY * 0.5 + (i % 2 === 0 ? 5 : -5);
                if (i === 0) {
                    ctx.lineTo(px, py);
                } else {
                    ctx.quadraticCurveTo(px + step/2, currentRadiusY * 0.5 + 10, px, py);
                }
            }
            
            ctx.closePath();

            // Glow effect
            ctx.shadowBlur = 25;
            ctx.shadowColor = this.scheme.main + '1)';

            // Gradient fill for the bell
            const gradient = ctx.createRadialGradient(0, -10, 5, 0, 0, this.radius);
            gradient.addColorStop(0, this.scheme.sub + '0.9)');
            gradient.addColorStop(0.7, this.scheme.main + '0.5)');
            gradient.addColorStop(1, this.scheme.main + '0.1)');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = this.scheme.main + '0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }
    }

    // Create jellyfish pool
    const jellyfishList = [];
    const jellyfishCount = 7;
    for (let i = 0; i < jellyfishCount; i++) {
        const j = new Jellyfish();
        // Stagger initial vertical positions
        j.y = Math.random() * canvas.height;
        jellyfishList.push(j);
    }

    // Animation Loop
    function animate() {
        // Deep sea background gradient
        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#01030d');
        bgGradient.addColorStop(0.5, '#051026');
        bgGradient.addColorStop(1, '#02050f');
        
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update and draw background particles
        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < 0) {
                p.y = canvas.height + 10;
                p.x = Math.random() * canvas.width;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();
        });

        // Update and draw jellyfish
        jellyfishList.forEach(j => {
            j.update();
            j.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
