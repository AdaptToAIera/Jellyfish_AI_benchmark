<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Sea Jellyfish</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="deepSea"></canvas>
<script>
const canvas = document.getElementById('deepSea');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Color palettes for jellyfish
const JELLY_COLORS = [
  { r: 0, g: 200, b: 255 },   // cyan
  { r: 200, g: 0, b: 255 },   // purple
  { r: 255, g: 100, b: 200 }, // pink
  { r: 0, g: 255, b: 150 },   // teal
  { r: 255, g: 50, b: 100 },  // magenta
  { r: 100, g: 150, b: 255 }, // blue
  { r: 255, g: 200, b: 50 },  // gold
  { r: 50, g: 255, b: 200 },  // mint
];

// --- Light Rays ---
class LightRay {
  constructor() {
    this.x = Math.random() * W;
    this.width = 30 + Math.random() * 80;
    this.alpha = 0.01 + Math.random() * 0.03;
    this.speed = 0.2 + Math.random() * 0.3;
    this.phase = Math.random() * Math.PI * 2;
  }
  draw(t) {
    const sway = Math.sin(t * 0.0005 + this.phase) * 40;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(this.x - this.width / 2, 0);
    ctx.lineTo(this.x + this.width / 2, 0);
    ctx.lineTo(this.x + this.width + sway, H);
    ctx.lineTo(this.x - this.width + sway, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgba(100, 180, 255, ${this.alpha * 1.5})`);
    grad.addColorStop(0.5, `rgba(50, 100, 200, ${this.alpha * 0.5})`);
    grad.addColorStop(1, `rgba(20, 40, 80, 0)`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }
}

// --- Particles / Plankton ---
class Particle {
  constructor() {
    this.reset();
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 10;
    this.size = 0.5 + Math.random() * 2;
    this.speed = 0.2 + Math.random() * 0.5;
    this.wobbleAmp = 1 + Math.random() * 3;
    this.phase = Math.random() * Math.PI * 2;
    this.alpha = 0.3 + Math.random() * 0.7;
    this.color = JELLY_COLORS[Math.floor(Math.random() * JELLY_COLORS.length)];
  }
  update(t) {
    this.y -= this.speed;
    this.x += Math.sin(t * 0.001 + this.phase) * 0.3;
    if (this.y < -10) this.reset();
  }
  draw(t) {
    const glow = 0.5 + Math.sin(t * 0.003 + this.phase) * 0.3;
    ctx.save();
    ctx.globalAlpha = this.alpha * glow;
    ctx.shadowBlur = this.size * 6;
    ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
    ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 1)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// --- Bubbles ---
class Bubble {
  constructor() {
    this.reset();
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 20;
    this.r = 2 + Math.random() * 5;
    this.speed = 0.5 + Math.random() * 1;
    this.wobble = Math.random() * Math.PI * 2;
    this.alpha = 0.15 + Math.random() * 0.25;
  }
  update() {
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * 0.4;
    this.wobble += 0.02;
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.strokeStyle = 'rgba(150, 220, 255, 0.6)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.stroke();
    // highlight
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.fill();
    ctx.restore();
  }
}

// --- Jellyfish ---
class Jellyfish {
  constructor() {
    this.reset(true);
  }
  reset(initial = false) {
    this.x = 80 + Math.random() * (W - 160);
    this.y = initial ? Math.random() * H * 0.8 : -150;
    this.domeR = 25 + Math.random() * 40;
    this.speed = 0.3 + Math.random() * 0.6;
    this.wobbleSpeed = 0.0008 + Math.random() * 0.001;
    this.wobbleAmp = 20 + Math.random() * 40;
    this.phase = Math.random() * Math.PI * 2;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.001 + Math.random() * 0.0015;
    this.color = JELLY_COLORS[Math.floor(Math.random() * JELLY_COLORS.length)];
    this.tentacleCount = 5 + Math.floor(Math.random() * 5);
    this.tentacleLen = this.domeR * (1.5 + Math.random() * 2);
    this.dir = Math.random() > 0.5 ? 1 : -1;
    this.drift = (Math.random() - 0.5) * 0.3;
  }
  update(t) {
    this.y += this.speed;
    this.x += Math.sin(t * this.wobbleSpeed + this.phase) * 0.5 + this.drift;
    if (this.y > H + 200) this.reset();
  }
  draw(t) {
    const pulse = 0.85 + Math.sin(t * this.pulseSpeed + this.pulsePhase) * 0.15;
    const r = this.color;
    const domeH = this.domeR * 0.7 * pulse;
    const domeW = this.domeR * pulse;
    const cx = this.x;
    const cy = this.y;

    ctx.save();

    // Outer glow
    const glowR = domeW * 3;
    const outerGlow = ctx.createRadialGradient(cx, cy, domeW * 0.5, cx, cy, glowR);
    outerGlow.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.15)`);
    outerGlow.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.05)`);
    outerGlow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Dome (bell)
    ctx.beginPath();
    ctx.moveTo(cx - domeW, cy);
    ctx.bezierCurveTo(
      cx - domeW, cy - domeH * 1.5,
      cx + domeW, cy - domeH * 1.5,
      cx + domeW, cy
    );
    ctx.closePath();

    const domeGrad = ctx.createRadialGradient(cx, cy - domeH * 0.5, 0, cx, cy - domeH * 0.3, domeW);
    domeGrad.addColorStop(0, `rgba(${Math.min(r + 80, 255)}, ${Math.min(g + 80, 255)}, ${Math.min(b + 80, 255)}, 0.9)`);
    domeGrad.addColorStop(0.6, `rgba(${r}, ${g}, ${b}, 0.6)`);
    domeGrad.addColorStop(1, `rgba(${Math.floor(r * 0.6)}, ${Math.floor(g * 0.6)}, ${Math.floor(b * 0.6)}, 0.3)`);
    ctx.fillStyle = domeGrad;
    ctx.shadowBlur = 30;
    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.8)`;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Dome outline
    ctx.strokeStyle = `rgba(${Math.min(r + 50, 255)}, ${Math.min(g + 50, 255)}, ${Math.min(b + 50, 255)}, 0.6)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner highlight
    ctx.beginPath();
    ctx.ellipse(cx, cy - domeH * 0.6, domeW * 0.4, domeH * 0.25, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
    ctx.fill();

    // Tentacles
    for (let i = 0; i < this.tentacleCount; i++) {
      const tX = cx - domeW + (domeW * 2 / (this.tentacleCount - 1)) * i;
      this.drawTentacle(tX, cy, t);
    }

    ctx.restore();
  }
  drawTentacle(sx, sy, t) {
    const segments = 12;
    const segLen = this.tentacleLen / segments;
    ctx.save();
    ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.4)`;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.6)`;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    for (let s = 1; s <= segments; s++) {
      const progress = s / segments;
      const wave = Math.sin(t * 0.002 + sx * 0.02 + s * 0.8) * (8 + progress * 15);
      const px = sx + wave;
      const py = sy + segLen * s;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// --- Seaweed ---
class Seaweed {
  constructor(x) {
    this.x = x;
    this.segments = 8 + Math.floor(Math.random() * 6);
    this.segLen = 15 + Math.random() * 20;
    this.hue = 100 + Math.random() * 60;
    this.phase = Math.random() * Math.PI * 2;
  }
  draw(t) {
    ctx.save();
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let px = this.x, py = H;
    ctx.moveTo(px, py);
    for (let i = 0; i < this.segments; i++) {
      const sway = Math.sin(t * 0.001 + this.phase + i * 0.5) * (8 + i * 3);
      px += sway * 0.3;
      py -= this.segLen;
      ctx.quadraticCurveTo(px + sway, py + this.segLen * 0.5, px, py);
    }
    const grad = ctx.createLinearGradient(0, H, 0, H - this.segments * this.segLen);
    grad.addColorStop(0, `hsla(${this.hue}, 60%, 20%, 0.8)`);
    grad.addColorStop(1, `hsla(${this.hue}, 50%, 35%, 0.5)`);
    ctx.strokeStyle = grad;
    ctx.stroke();
    ctx.restore();
  }
}

// --- Initialize scene ---
const lightRays = Array.from({ length: 6 }, () => new LightRay());
const particles = Array.from({ length: 80 }, () => new Particle());
const bubbles = Array.from({ length: 30 }, () => new Bubble());
const jellyfish = Array.from({ length: 8 }, () => new Jellyfish());
const seaweeds = Array.from({ length: 12 }, (_, i) =>
  new Seaweed(40 + i * (W / 12) + Math.random() * 60)
);

// --- Background gradient ---
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(0.3, '#0c1e3a');
  grad.addColorStop(0.6, '#0a1830');
  grad.addColorStop(0.85, '#061020');
  grad.addColorStop(1, '#030810');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// --- Main loop ---
function animate(timestamp) {
  drawBackground();

  // Light rays
  lightRays.forEach(ray => ray.draw(timestamp));

  // Seaweed
  seaweeds.forEach(sw => sw.draw(timestamp));

  // Particles
  particles.forEach(p => { p.update(timestamp); p.draw(timestamp); });

  // Bubbles
  bubbles.forEach(b => { b.update(); b.draw(); });

  // Jellyfish (sorted by y for depth)
  jellyfish.forEach(j => j.update(timestamp));
  jellyfish.sort((a, b) => a.y - b.y);
  jellyfish.forEach(j => j.draw(timestamp));

  // Vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
