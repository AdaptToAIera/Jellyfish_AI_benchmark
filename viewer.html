<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">

          <button type="button" data-pref-lang="en">EN</button>
          <button type="button" data-pref-lang="sk">SK</button>

        <div class="segmented" role="group" aria-label="Theme">

    </div>
  </header>
  <main class="viewer-shell">
    <iframe id="viewerFrame" title="Large HTML preview" sandbox="allow-scripts"></iframe>
  </main>
  <script src="data/models-data.js"></script>
  <script src="preferences.js"></script>
